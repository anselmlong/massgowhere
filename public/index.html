<meta name="description" content="Find a Catholic Mass in Singapore you can actually make, from where you are, and when to leave.">

<body>
<!--
THESIS: One screen, one answer: the Mass you can make and when to leave. Refuses the category default of a map full of pins and a list you must reason over yourself.
OWN-WORLD: Bright white ground, near-black ink, and a single accent taken from the Church's liturgical season (green, violet, gold, red) that appears only on the one action and the season mark. Atkinson Hyperlegible Next (chosen for easy reading), tabular numerals, a monumental time.
STORY: The visitor sees the time, the church, when to leave; taps Navigate. Everything else is one tap away, never on the page.
FIRST VIEWPORT: Home: title, one-line promise, travel mode, full-width "Use my location" in the season colour, postcode search under it. Result: day, 88px time, church name, leave-by line, full-width Navigate.
FORM: Liturgical Seasons, safer-register pick (grounded list), seed 8e32a930.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
<div class="shell">
  <header class="top">
    <a class="wordmark" href="#/" aria-label="MassGoWhere home"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M14.5 7h3v5h5v3h-5v10h-3V15h-5v-3h5z"/></svg>MassGoWhere</a>
    <div class="top-tools">
      <button class="season" id="season" type="button" aria-haspopup="dialog"><i aria-hidden="true"></i><span></span></button>
      <button class="theme-toggle" id="theme-toggle" type="button"></button>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
  <footer class="foot">
    <details class="why-built feedback">
      <summary>Send feedback</summary>
      <form id="feedback" novalidate>
        <label for="fb-msg">What’s working, what isn’t, or a Mass time that’s wrong. It goes straight to Anselm.</label>
        <textarea id="fb-msg" name="message" rows="4" maxlength="2000" required></textarea>
        <label for="fb-contact">Your email or Telegram, if you’d like a reply <span>(optional)</span></label>
        <input id="fb-contact" name="contact" type="text" maxlength="200" autocomplete="email">
        <input class="hp" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="btn btn-quiet" type="submit">Send feedback</button>
        <p class="fb-status" role="status"></p>
      </form>
    </details>
    <p>Built by <a href="https://anselmlong.com" target="_blank" rel="noopener">Anselm</a>. Also on Telegram: <a href="https://t.me/massgowherebot" target="_blank" rel="noopener">@massgowherebot</a>, and the <a href="https://t.me/sg_daily_gospel_bot" target="_blank" rel="noopener">Daily Gospel bot</a> for each day’s readings.</p>
  </footer>
</div>
<div class="palette-picker" id="palette-picker" hidden></div>

</body>
</html>
