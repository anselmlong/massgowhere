<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MassGoWhere</title>
<meta name="description" content="Find the nearest Catholic church and the next Mass time in Singapore.">
<meta name="theme-color" content="#7a1f2b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237a1f2b'/><path d='M14 6h4v6h6v4h-6v10h-4V16H8v-4h6z' fill='%23fdf8f0'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="panel">
    <header class="head">
      <h1>MassGoWhere</h1>
      <p class="sub">Catholic churches &amp; Mass times across Singapore</p>
      <button id="locate" class="btn-primary" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A9 9 0 0 0 13 3.06V1h-2v2.06A9 9 0 0 0 3.06 11H1v2h2.06A9 9 0 0 0 11 20.94V23h2v-2.06A9 9 0 0 0 20.94 13H23v-2h-2.06zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg>
        <span>Use my location</span>
      </button>
      <p id="loc-hint" class="hint">Or tap anywhere on the map to set a starting point.</p>
    </header>

    <section id="summary" class="summary" hidden></section>

    <div class="controls">
      <div class="tabs" role="tablist">
        <button role="tab" class="tab" data-tab="masses" aria-selected="true">Next Masses</button>
        <button role="tab" class="tab" data-tab="churches" aria-selected="false">Churches</button>
      </div>
      <div class="row">
        <label class="select">Sort
          <select id="sort">
            <option value="time">Soonest</option>
            <option value="distance">Nearest</option>
          </select>
        </label>
        <label class="select">Language
          <select id="lang"><option value="">All</option></select>
        </label>
        <label class="select">Travel
          <select id="mode">
            <option value="transit">Public transport</option>
            <option value="driving">Car / taxi</option>
            <option value="walking">Walk</option>
          </select>
        </label>
      </div>
    </div>

    <ol id="list" class="list" aria-live="polite"></ol>

    <footer class="foot">
      Times from <a href="https://mycatholic.sg/mass-schedules" target="_blank" rel="noopener">myCatholicSG</a>,
      last updated <span id="asof"></span>. Special feasts and changes may be missing, so check with the parish.
      Travel times are rough estimates; Google Maps gives live ones.
    </footer>
  </aside>
  <main class="mapwrap"><div id="map" aria-label="Map of Catholic churches in Singapore"></div></main>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <button class="close" id="sheet-close" aria-label="Close">×</button>
    <div id="sheet-body"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="schedule.js"></script>
<script src="app.js"></script>
</body>
</html>
